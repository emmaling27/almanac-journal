name: CI & Production Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: npm test

      - name: Validate Next.js Build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://compassionate-minnow-316.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://compassionate-minnow-316.convex.site
        run: npm run build

  deploy:
    name: Deploy to Convex Production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Deploy Convex Backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy -y

      - name: Build Production Frontend
        env:
          NEXT_PUBLIC_CONVEX_URL: https://compassionate-minnow-316.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://compassionate-minnow-316.convex.site
        run: npm run build

      - name: Deploy Static Web Assets
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx @convex-dev/static-hosting upload -d out --prod
